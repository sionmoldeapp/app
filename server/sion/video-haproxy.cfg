# Tailscale avslutter TLS. Del deretter den sikre porten mellom nettsiden (HTTP/WebSocket)
# og LiveKit TURN (binær STUN). Ingen nøkler eller innloggingsbevis logges her.
global
    maxconn 512
defaults
    mode tcp
    timeout connect 10s
    timeout client 2h
    timeout server 2h
resolvers docker
    nameserver dns 127.0.0.11:53
    resolve_retries 3
    timeout retry 1s
    hold valid 10s
frontend sikker_app_og_video
    bind :8080
    tcp-request inspect-delay 5s
    acl turn_start req.payload(0,1) -m bin 00
    tcp-request content accept if HTTP
    tcp-request content accept if turn_start
    use_backend app if HTTP
    default_backend video
backend app
    server app sion-web:8091 resolvers docker init-addr libc,none
backend video
    server video sion-video:10000 resolvers docker init-addr libc,none
