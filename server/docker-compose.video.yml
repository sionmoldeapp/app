# Valgfri videotjeneste. Legges til COMPOSE_FILE først etter at nettadresse og medieporter er avklart.
# Standard er kun PC-en selv. Ikke endre bindingene til 0.0.0.0 uten å vurdere brannmur/TLS/TURN.
services:
  sion-video:
    image: livekit/livekit-server:v1.13.11
    restart: unless-stopped
    environment:
      LIVEKIT_CONFIG: |
        port: 7880
        rtc:
          tcp_port: 7881
          udp_port: 7882
          use_external_ip: false
          node_ip: ${LIVEKIT_NODE_IP:-127.0.0.1}
        keys:
          ${LIVEKIT_API_KEY:?Sett LIVEKIT_API_KEY}: ${LIVEKIT_API_SECRET:?Sett LIVEKIT_API_SECRET}
        room:
          max_participants: 12
          empty_timeout: 120
          departure_timeout: 30
    ports:
      - 127.0.0.1:7880:7880
      - ${LIVEKIT_MEDIA_BIND:-127.0.0.1}:7881:7881
      - ${LIVEKIT_MEDIA_BIND:-127.0.0.1}:7882:7882/udp

  sion-varsel:
    environment:
      LIVEKIT_URL: ${LIVEKIT_URL:?Sett sikker nettadresse til video}
      LIVEKIT_API_URL: http://sion-video:7880
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET}
