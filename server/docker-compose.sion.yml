# Sion Molde: legges oppå Supabase sin docker-compose.yml (se COMPOSE_FILE i .env og SION.md).
# Gjelder både på PC-en og på serveren. Supabase sine egne filer endres ikke, så update.sh virker.

services:

  # API-et nås bare gjennom sion-web (samme adresse som appen), ikke på egen port.
  api-gw:
    ports: !reset []

  # Databasen (via Supavisor) bare fra maskinen selv, aldri fra internett.
  supavisor:
    ports: !override
      - 127.0.0.1:${POSTGRES_PORT}:5432
      - 127.0.0.1:${POOLER_PROXY_PORT_TRANSACTION}:6543

  # Caddy: viser appen, sender /auth/v1, /rest/v1 osv. til Supabase og gir HTTPS på serveren.
  # Studio (database-GUI) på egen port med passord (DASHBOARD_USERNAME/PASSWORD).
  sion-web:
    container_name: sion-web
    image: caddy:2.10.2-alpine
    restart: unless-stopped
    ports:
      - ${APP_HTTP_PORT:-80}:80
      - ${APP_HTTPS_PORT:-443}:443
      - ${STUDIO_BIND:-127.0.0.1:3001}:3001
    depends_on:
      api-gw:
        condition: service_healthy
      studio:
        condition: service_healthy
    environment:
      APP_SITE: ${APP_SITE:-:80}
      DASHBOARD_USERNAME: ${DASHBOARD_USERNAME}
      DASHBOARD_PASSWORD: ${DASHBOARD_PASSWORD}
    command:
      - /bin/sh
      - -c
      - |
        export DASHBOARD_PASSWORD_HASH=$$(caddy hash-password --plaintext "$$DASHBOARD_PASSWORD") && \
        exec caddy run --config /etc/caddy/Caddyfile --adapter caddyfile
    volumes:
      # Hele repoet, skrivebeskyttet. Caddyfile slipper bare gjennom appens offentlige filer.
      - ..:/repo:ro
      - ./sion/Caddyfile:/etc/caddy/Caddyfile:ro
      - sion_caddy_data:/data
      - sion_caddy_config:/config

  # Sikkerhetskopi hver natt til mappen backups/ (database + opplastede filer).
  # Samme bilde som databasen, så pg_dump har riktig versjon.
  sion-backup:
    container_name: sion-backup
    image: supabase/postgres:17.6.1.136
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGPORT: ${POSTGRES_PORT}
      PGDATABASE: ${POSTGRES_DB}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      BACKUP_TIME: ${BACKUP_TIME:-03:00}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
      TZ: ${TZ:-Europe/Oslo}
    entrypoint: ["/bin/sh", "/backup.sh"]
    # Bildet har databasens egen helsesjekk (Postgres inni containeren); her sjekkes at databasen nås.
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "db", "-U", "supabase_admin"]
      interval: 60s
      timeout: 5s
      retries: 3
    volumes:
      - ./sion/backup.sh:/backup.sh:ro
      - ./backups:/backups
      - ./volumes/storage:/storage:ro

volumes:
  sion_caddy_data:
  sion_caddy_config:
