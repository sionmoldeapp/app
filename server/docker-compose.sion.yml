# Sion Molde: legges oppå Supabase sin docker-compose.yml (se COMPOSE_FILE i .env og SION.md).
# Gjelder både på PC-en og på serveren. Supabase sine egne filer endres ikke, så update.sh virker.

services:

  # API-et nås bare gjennom sion-web (samme adresse som appen), ikke på egen port.
  api-gw:
    ports: !reset []

  # Databasen (via Supavisor) bare fra maskinen selv, aldri fra internett.
  supavisor:
    ports: !override
      - 127.0.0.1:${POSTGRES_PORT}:5432
      - 127.0.0.1:${POOLER_PROXY_PORT_TRANSACTION}:6543

  # Caddy: viser appen, sender /auth/v1, /rest/v1 osv. til Supabase og gir HTTPS på serveren.
  # Norske e-poster fra innloggingen (malene ligger i sion/epost og vises av sion-web på den interne porten 8099).
  auth:
    environment:
      GOTRUE_MAILER_SUBJECTS_CONFIRMATION: "Velkommen til Sion Molde-appen"
      GOTRUE_MAILER_SUBJECTS_RECOVERY: "Nytt passord til Sion Molde-appen"
      GOTRUE_MAILER_SUBJECTS_INVITE: "Du er invitert til Sion Molde-appen"
      GOTRUE_MAILER_SUBJECTS_EMAIL_CHANGE: "Bekreft ny e-postadresse"
      GOTRUE_MAILER_SUBJECTS_MAGIC_LINK: "Logg inn i Sion Molde-appen"
      GOTRUE_MAILER_TEMPLATES_CONFIRMATION: http://sion-web:8099/ny-bruker.html
      GOTRUE_MAILER_TEMPLATES_RECOVERY: http://sion-web:8099/nytt-passord.html
      GOTRUE_MAILER_TEMPLATES_INVITE: http://sion-web:8099/invitasjon.html
      GOTRUE_MAILER_TEMPLATES_EMAIL_CHANGE: http://sion-web:8099/ny-epost.html
      GOTRUE_MAILER_TEMPLATES_MAGIC_LINK: http://sion-web:8099/logg-inn.html

  # Studio (database-GUI) på egen port med passord (DASHBOARD_USERNAME/PASSWORD).
  sion-web:
    container_name: sion-web
    image: caddy:2.10.2-alpine
    restart: unless-stopped
    ports:
      - ${APP_HTTP_PORT:-80}:80
      - ${APP_HTTPS_PORT:-443}:443
      - ${STUDIO_BIND:-127.0.0.1:3001}:3001
    depends_on:
      api-gw:
        condition: service_healthy
      studio:
        condition: service_healthy
    environment:
      APP_SITE: ${APP_SITE:-:80}
      ANON_KEY: ${ANON_KEY}   # offentlig nøkkel til appen (sion-konfig.json)
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY}   # offentlig nøkkel for push-varsler (også i sion-konfig.json)
      DASHBOARD_USERNAME: ${DASHBOARD_USERNAME}
      DASHBOARD_PASSWORD: ${DASHBOARD_PASSWORD}
    command:
      - /bin/sh
      - -c
      - |
        export DASHBOARD_PASSWORD_HASH=$$(caddy hash-password --plaintext "$$DASHBOARD_PASSWORD") && \
        exec caddy run --config /etc/caddy/Caddyfile --adapter caddyfile
    volumes:
      # Hele repoet, skrivebeskyttet. Caddyfile slipper bare gjennom appens offentlige filer.
      - ..:/repo:ro
      - ./sion/Caddyfile:/etc/caddy/Caddyfile:ro
      - sion_caddy_data:/data
      - sion_caddy_config:/config

  # Push-varsler (Web Push). Appen kaller /varsel (via sion-web) på samme måte som den før kalte Apps Script. Se sion/varsel/varsel.js.
  sion-varsel:
    container_name: sion-varsel
    image: node:22-alpine
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      auth:
        condition: service_started
    working_dir: /app
    environment:
      PGHOST: db
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      ANON_KEY: ${ANON_KEY}
      GOTRUE_URL: http://auth:9999
      TALE_URL: http://sion-tale:8080
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:post@sionmolde.no}
      # E-post (notat, forbønner, saker, velkomst, påmeldte, hilsen, faktura): samme SMTP som innloggingen
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      SMTP_ADMIN_EMAIL: ${SMTP_ADMIN_EMAIL}
      SMTP_SENDER_NAME: ${SMTP_SENDER_NAME}
      APP_URL: ${SITE_URL}   # lenker i e-post og selvbetjeningslenker
      TZ: ${TZ:-Europe/Oslo}
    command: ["/bin/sh", "-c", "npm install --omit=dev --no-audit --no-fund --loglevel=error && exec node varsel.js"]
    volumes:
      - ./sion/varsel:/app
      - sion_varsel_modules:/app/node_modules

  # Snakk til tekst uten pip: lyden tas opp i appen og skrives ut her (whisper.cpp med norsk modell fra Nasjonalbiblioteket).
  # Nås bare fra sion-varsel (/tale), lyden forlater aldri serveren. Modellen hentes med: node server/sion/hent-tale.js (ca. 175 MB).
  sion-tale:
    container_name: sion-tale
    image: ghcr.io/ggml-org/whisper.cpp:main
    restart: unless-stopped
    entrypoint: ["/app/build/bin/whisper-server", "-m", "/modell/nb-whisper-small-q5_0.bin", "--host", "0.0.0.0", "--port", "8080", "--convert", "-l", "no", "-t", "4"]
    volumes:
      - ./volumes/tale:/modell:ro

  # Sikkerhetskopi hver natt til mappen backups/ (database + opplastede filer).
  # Samme bilde som databasen, så pg_dump har riktig versjon.
  sion-backup:
    container_name: sion-backup
    image: supabase/postgres:17.6.1.136
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGPORT: ${POSTGRES_PORT}
      PGDATABASE: ${POSTGRES_DB}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      BACKUP_TIME: ${BACKUP_TIME:-03:00}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
      TZ: ${TZ:-Europe/Oslo}
    entrypoint: ["/bin/sh", "/backup.sh"]
    # Bildet har databasens egen helsesjekk (Postgres inni containeren); her sjekkes at databasen nås.
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "db", "-U", "supabase_admin"]
      interval: 60s
      timeout: 5s
      retries: 3
    volumes:
      - ./sion/backup.sh:/backup.sh:ro
      - ./backups:/backups
      - ./volumes/storage:/storage:ro

volumes:
  sion_varsel_modules:
  sion_caddy_data:
  sion_caddy_config:
