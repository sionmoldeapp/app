<script>
const $=s=>document.querySelector(s);

const DAYS=['søndag','mandag','tirsdag','onsdag','torsdag','fredag','lørdag'];
const MON=['jan','feb','mar','apr','mai','jun','jul','aug','sep','okt','nov','des'];
const now=new Date();
const cap=s=>s[0].toUpperCase()+s.slice(1);
$('#today').textContent=cap(DAYS[now.getDay()])+' '+now.getDate()+'. '+MON[now.getMonth()];

/* Innhold hentes fra Firebase (Firestore). Hvis databasen er tom eller utilgjengelig, brukes
   JSON-filene i data/ som reserve. Innlogging og adminskjema bruker Firebase Authentication. */
let FB=null,usingFb=false;
let events=[],posts=[],regular=[],rawEvents=[],members=[],leaderMem=[],counts={},views={};
const todayStart=new Date(now);todayStart.setHours(0,0,0,0);
let seen=0;try{seen=+localStorage.getItem('sm-seen')||0}catch(e){}
const markSeen=()=>{seen=Date.now();try{localStorage.setItem('sm-seen',String(seen))}catch(e){}posts.forEach(p=>p.read=true);state.unread=0};
const isNew=p=>p.ms?p.ms>seen:!!(p.unread&&!p.read);
const getJson=f=>fetch('data/'+f+'.json').then(r=>r.json());
async function fetchAll(){
  if(FB){
    try{
      const [e,p,g]=await Promise.all([FB.list('events'),FB.list('posts'),FB.list('regular')]);
      if(e.length||p.length||g.length){usingFb=true;
        try{localStorage.setItem('sm-cache',JSON.stringify({e:e.filter(x=>!x.m),p:p.filter(x=>!x.m),g:g.filter(x=>!x.m)}))}catch(er){}   // bare det som er åpent for alle; brukes til rask oppstart
        return [e,p,g]}
    }catch(err){console.warn('Firestore:',err)}
  }
  usingFb=false;

/* Arrangementer, nyheter og faste samlinger: filtrerer og sorterer det som er lastet (fra databasen eller fra den lokale kopien). */
function bruk(e,p,g){
  rawEvents=e;
  events=e.filter(x=>canSee(x)&&canSeeCat(x.cat)&&liveOK(x)).map(x=>({...x,t:esc(x.title),d:linkify(esc(x.text)),w:new Date(x.start+'T'+(x.time||'00:00')),e:x.end?new Date(x.end+'T23:59'):null}))

let pushTallCache={t:0,v:null};

  const v=await FB.pushCount().catch(()=>null);pushTallCache={t:Date.now(),v};return v}

  // Alle forespørslene sendes samtidig (tidligere én og én, og det tok mange sekunder).
  const ok=p=>p.catch(()=>null);
  const [gr,ca,ko,gv,pv,lt,fr,jm]=await Promise.all([FB?ok(FB.groupsList()):null,FB?ok(FB.catsList()):null,FB?ok(FB.getContact()):null,FB?ok(FB.getGiving()):null,FB&&state.user?ok(FB.getPrivacy()):null,FB&&state.admin?ok(FB.ltypesList()):null,fetchAll(),FB?ok(FB.getJul()):null]);
  if(gr)applyGroups(gr);
  if(ca)applyCats(ca);
  if(ko)state.contact=ko;
  if(gv)state.giving=gv;
  if(jm)state.jul=jm;
  if(FB&&state.user)state.pv=pv;
  if(lt)applyLtypes(lt);
  bruk(...fr);

    usingFb&&FB?FB.counts().catch(()=>({})):{},
    state.admin&&FB?FB.listUsers().catch(()=>[]):[],

function isoUke(d){const t=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())),dag=t.getUTCDay()||7;t.setUTCDate(t.getUTCDate()+4-dag);const y0=new Date(Date.UTC(t.getUTCFullYear(),0,1));return Math.ceil(((t-y0)/864e5+1)/7)}

  if(/partall/.test(v)||(!v&&/partallsuke/.test(n)))return 'partall';
  if(/oddetall/.test(v)||(!v&&/oddetallsuke/.test(n)))return 'oddetall';
  return 'alle'}
const ukeOK=(r,w)=>{const v=ukeValg(r);if(v==='maned')return false;return v==='alle'||(isoUke(w)%2===0)===(v==='partall')};

function julTilfeldig(n){const a=new Uint32Array(1),lim=Math.floor(4294967296/n)*n;let x;do{crypto.getRandomValues(a);x=a[0]}while(x>=lim);return x%n}

/* ---------- Ansvarsområder og beskjeder ----------
   roles/{id}: ansvarsområde med personer (navn, telefon, e-post). Bare medlemmer leser, administrator endrer.
   threads/{id}: en samtale mellom et medlem og de ansvarlige for et område, med meldinger i threads/{id}/messages.
   Bare deltakerne (parts, e-postadresser) leser og skriver. Ansvarspersonene får push-varsel via Apps Script (action beskjed). */
async function loadRoles(){

  keep(()=>{})}
/* ---------- Chat (som Messenger) ----------

   nye meldinger med en gang uten å hente alt på nytt. Gruppeledere og administratorer kan skrive til hele gruppen (hver person får en
   privat samtale og svarer der) eller til én person. Ingen nye regler: bruker de samme reglene som privat beskjed (kind dm). */
state.chat=state.chat||{vis:false,vy:'liste',id:null,ny:null,msgs:[],unsub:null,sender:false};
const chatUlest=()=>(state.threads||[]).filter(t=>(t.unread||[]).includes(meEmail())).length;

const chatFarger=['#3f8ad6','#c8741f','#1f7a96','#7d55c7','#b8405a','#2b8f62'];
function chatAv(navn){const n=String(navn||'?').trim()||'?',d=n.split(/\s+/),ini=((d[0]||'?')[0]+(d.length>1?d[d.length-1][0]:'')).toUpperCase();let h=0;for(const ch of n)h=(h*31+ch.charCodeAt(0))>>>0;return '<span class="cav" style="background:'+chatFarger[h%chatFarger.length]+'" aria-hidden="true">'+esc(ini)+'</span>'}
const chatKl=ms=>{const d=new Date(ms),p=n=>String(n).padStart(2,'0');return p(d.getHours())+':'+p(d.getMinutes())};

const chatTraad=id=>(state.threads||[]).find(t=>t.id===id);

/* Lytter på samtalene til brukeren (maks 50). Første kall setter opp lytteren; senere kall gjør ingenting. */

    state.thrUnsub=FB.watchThreads(meEmail(),l=>{state.threads=l;state.meldMsg='';chatTraadEndret();res()},e=>{state.threads=state.threads||[];state.meldMsg='Kunne ikke hente samtaler ('+((e&&e.code)||'feil')+'). Er de nye reglene publisert i Firebase?';chatTraadEndret();res()})});
  return state.thrPromise}

    else if(c.vy==='samtale'&&c.id)chatLest()}catch(e){}}
function chatLest(){const t=chatTraad(state.chat.id),meg=meEmail();if(t&&(t.unread||[]).includes(meg)){t.unread=t.unread.filter(x=>x!==meg);FB.markThreadRead(t.id).catch(()=>{});try{drawTabs()}catch(e){}}}

function chatLukk(){const c=state.chat;chatStoppMsgs();c.vis=false;c.id=null;c.ny=null;chatEl().hidden=true;document.body.style.overflow=''}

const chatSend='<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2L11 13"/><path d="M22 2l-7 20-4-9-9-4z"/></svg>';

/* Ny melding: velg hele gruppen eller en person. Bare ledere og administratorer. */

async function chatTil(epost,gid,navn){

async function chatSendTekst(tekst){

/* Personvernerklæring (vises under Mer for innloggede). Administrator kan endre teksten i appen (settings/personvern). Enkel skrivemåte:
   «## Overskrift», «- punkt», tom linje mellom avsnitt og **fet**. Standardteksten under brukes til noe er lagret. Hold den i samsvar med behandlingsoversikten (personvern/ utenfor repoet). */
const PV_STD_DATO='2026-10-20';
const PV_STD=`## Hvem er ansvarlig?
**Pinsemenigheten Sion Molde og omegn** (org.nr. 976 222 253), Kometvegen 7, 6419 Molde, er ansvarlig for personopplysningene i appen. Kontakt oss om personvern: post@sionmolde.no eller telefon 71 25 10 29.

## Hva lagrer vi, og hvorfor?
- **Innlogging:** e-postadresse og passord. Passordet lagres kryptert i databasen, og vi kan ikke se det. For at du skal få tilgang.
- **Medlemsliste:** e-post, navn hvis du har lagt det inn, grupper og rolle. For å gi riktig innhold og varsler. Administratorer og gruppeledere (for sine grupper) ser dette.
- **«Jeg kommer»:** navn og kontaktopplysning du skriver inn. Ledere ser hvem som kommer. Svarene lagres også i et regneark hos Google Drive.
- **Møtenotater:** dine private notater. Bare du kan lese dem, ikke engang administratorer.
- **Forbønn:** teksten, navn og tidspunkt. Bare administratorer og de som leder bønnemøtene ser dem. Innloggede sender med navn. Uten innlogging sendes de anonymt.
- **Beskjeder:** meldinger mellom deg og de ansvarlige. Bare deltakerne i samtalen ser dem.
- **Vakter:** navn og e-post på vaktlisten. Gruppens medlemmer og leder ser den.
- **Varselkode:** en kode for telefonen din, koblet til e-posten din hvis du er innlogget, så vi kan sende varsler du har bedt om.
- **Nyhetsbrev Sommerstevne:** e-postadressen din, i et regneark hos Google Drive, bare til informasjon om sommerstevnet.
- **Politiattest:** datoen attesten ble utstedt og, hvis du velger det, selve dokumentet (bilde eller PDF). Dato og dokument gjelder først når både du og gruppelederen din har bekreftet, og endring eller sletting må også bekreftes av begge. Bare du, gruppelederen din og administratorene ser den. Den slettes hvis du eller begge parter sletter den, og når du sletter deg selv.
- **Innstillinger:** rekkefølge på kort og tekststørrelse. Noe lagres bare på telefonen din.

Vi bruker ikke annonser eller sporing, og vi selger eller deler ikke opplysninger med andre. Dataene lagres og driftes hos Google på våre vegne.

## Sensitive opplysninger
At noen tilhører en menighet, og forbønner som kan handle om tro eller helse, regnes som særlig sensitive opplysninger. Vi behandler opplysninger om medlemmer og andre med jevnlig kontakt bare i menighetens virksomhet, og gir dem ikke videre utenfor menigheten uten samtykke. Forbønner sender du inn frivillig, og du kan slette dem når som helst. **Skriv ikke inn helseopplysninger om andre uten at de har sagt ja.**

## Hvor lenge lagrer vi?
- Medlemmer: så lenge du er med. Du kan slette deg selv når som helst.
- Forbønn: vises i en uke og slettes automatisk etter 30 dager.
- «Jeg kommer» i appen: slettes automatisk 90 dager etter arrangementet. Svar i regnearkene slettes når du ber om det.
- Beskjeder: slettes automatisk etter ett år uten bruk.
- Møtenotater: til du sletter dem eller sletter deg selv.
- Nyhetsbrev: til du ber om å bli fjernet.

## Dine rettigheter
Du kan be om **innsyn**, **retting**, **sletting**, begrensning og å trekke tilbake samtykke. Under Mer → Min profil kan du **laste ned alt appen har lagret om deg** og **slette deg selv** med dataene dine (konto, notater, forbønner og samtaler du har startet). Trenger du hjelp, send e-post til post@sionmolde.no. Vi svarer innen 30 dager. Mener du at vi ikke følger reglene, kan du klage til Datatilsynet: https://www.datatilsynet.no

## Barn
Appen er ikke laget for barn under 13 år, og vi registrerer ikke opplysninger om barn under 13 år. Ledere skal ikke legge dem inn. Oppdager vi det, sletter vi opplysningene.

## Sikkerhet
Dataene lagres hos Google og overføres kryptert. Databasen har regler for hvem som kan lese og endre hva. Beskjeder og forbønner er ikke ende-til-ende-krypterte, så ikke skriv noe svært sensitivt der. Hvis det skjer et avvik som kan skade deg, varsler vi deg og Datatilsynet i samsvar med loven.

## Lokal lagring
Appen lagrer innstillinger på telefonen din (for eksempel tekststørrelse og innlogging). Det er ikke sporing. Slår du på varsler, lagres en kode for telefonen din så varselsystemet kan nå den.`;
function pvHtml(t){

/* ---------- Politiattest ----------
   attester/{e-post} {dato, by, updated, godkjent:true, fil:bool}: godkjent dato (fil = at et dokument er lagret). Selve dokumentet (bilde eller PDF) ligger i attestfil/{e-post}.
   Alle endringer går via et forslag, attestforslag/{e-post} {k:'sett'|'slett', dato, by, okM (medlemmet har bekreftet), okL (gruppeleder eller administrator har bekreftet), okLby, fil, ms},
   med det foreslåtte dokumentet i attestfilny/{e-post}. Forslaget gjelder først når BÅDE medlemmet og en gruppeleder (eller administrator) har bekreftet; den som bekrefter sist, fullfører.
   Administratorens egen attest bekreftes av administratoren selv. Å slette seg selv fra appen trenger ingen bekreftelse (alt fjernes). Gyldig i 3 år. Apps Script minner om fornyelse 60 dager før. */
const ATTEST_AAR=3,ATTEST_VARSEL_DAGER=60,ATTEST_MAKS=900000;
function attestStatus(dato){
  if(!/^\d{4}-\d{2}-\d{2}$/.test(dato||''))return null;
  const d=new Date(dato+'T12:00');d.setFullYear(d.getFullYear()+ATTEST_AAR);
  const dager=Math.ceil((d.getTime()-Date.now())/864e5),utl=isoDato(d);
  return {utl,dager,tekst:dager<0?'Utløpt':dager<=ATTEST_VARSEL_DAGER?'Utløper snart':'Gyldig',farge:dager<0?'#b3261e':dager<=ATTEST_VARSEL_DAGER?'var(--lamp)':'var(--ok)'}}
const attestVenter='<span class="tag" style="background:var(--lamp);color:var(--lamp-ink)">Venter bekreftelse</span>';
const attestChip=st=>st?'<span class="tag" style="background:'+st.farge+';color:#fff">'+st.tekst+'</span>':'';
const profSub=(k,tittel,html)=>'<details class="acc sub" data-acc="'+k+'" '+(state.acc[k]?'open':'')+' style="margin-top:10px"><summary><h3 style="font-size:var(--t-l)">'+tittel+'</h3></summary>'+html+'</details>';
const attErMeg=email=>String(email).toLowerCase()===meEmail();
const attKanLed=email=>!attErMeg(email)||!!state.admin;   // gruppeleder kan ikke bekrefte sin egen attest, administrator kan
const attForslagTekst=p=>p.k==='slett'?'Forslag: slette politiattesten':'Forslag: dato '+noDato(p.dato)+(p.fil?' med dokument':'');
const attSider=p=>'Medlem: '+(p.okM?'✓ bekreftet':'venter')+' · Gruppeleder: '+(p.okL?'✓ bekreftet':'venter');
/* Leser en fil (bilde eller PDF) som tekst. Bilder krympes til en JPEG som får plass i databasen. */
function attFilLes(f){
  return new Promise((res,rej)=>{
    if(!f)return res(null);
    if(f.type==='application/pdf'){
      if(f.size>600*1024)return rej({msg:'PDF-en er for stor (maks 600 kB). Ta heller et bilde av attesten.'});
      const r=new FileReader();r.onload=()=>res({data:String(r.result),ftype:'application/pdf',fnavn:String(f.name||'politiattest.pdf').slice(0,80)});r.onerror=()=>rej({msg:'Kunne ikke lese filen.'});r.readAsDataURL(f);return}
    if(!/^image\//.test(f.type))return rej({msg:'Velg et bilde eller en PDF.'});
    const url=URL.createObjectURL(f),img=new Image();
    img.onload=()=>{URL.revokeObjectURL(url);let dim=1500,q=.82,data='';
      for(let i=0;i<8;i++){const s=Math.min(1,dim/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=Math.max(1,Math.round(img.width*s));c.height=Math.max(1,Math.round(img.height*s));
        const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(img,0,0,c.width,c.height);data=c.toDataURL('image/jpeg',q);
        if(data.length<=ATTEST_MAKS*.85)break;dim=Math.round(dim*.8);q=Math.max(.5,q-.06)}
      if(data.length>ATTEST_MAKS*.9)return rej({msg:'Bildet er for stort. Prøv et mindre bilde.'});
      res({data,ftype:'image/jpeg',fnavn:'politiattest.jpg'})};
    img.onerror=()=>{URL.revokeObjectURL(url);rej({msg:'Kunne ikke lese bildet.'})};img.src=url})}

/* Foreslår ny dato/dokument eller sletting. Egen side bekreftes med en gang; administratorens egen attest er ferdig bekreftet. */
async function attForeslaa(email,k,dato,fil){

      state.fast=medl;state.authVent=medl;bruk(c.e,medl?[]:c.p,c.g);state.unread=posts.filter(p=>isNew(p)&&!postSkjult(p)).length;if(state.tab==='news')markSeen();first=false;render();splashBort()}}catch(er){first=true}
  if(state.authVent)setTimeout(()=>{if(state.authVent){state.authVent=false;state.fast=false;keep(()=>{})}},15000); FB=await window.fbReady;
  if(FB){FB.pushSupported().then(v=>{state.pushOk=v;if(state.tab==='me'||state.tab==='home')keep(()=>{})});FB.onPush(p=>{const t=(p.notification&&p.notification.title)||'Melding',b=(p.notification&&p.notification.body)||'';push(t,b);varselLagre(t,b);nyMelding()})}
  const go=async u=>{
    state.user=u||null;if(!u)state.authVent=false;
    const [adm,mem]=u?await Promise.all([FB.isAdmin(u.email),FB.isMember(u.email)]):[false,false];
    state.admin=!!adm;
    state.member=!!u&&(state.admin||!!mem);
    FB.full=state.member;
    state.view='meg';state.real=null;
    if(state.admin)FB.ensureSnapshot('Automatisk',20*3600e3).then(()=>{state.snaps=null}).catch(()=>{});
    const med=!!u&&state.member,ikkeAdm=med&&!state.admin;
    const [grp,lds,ldr,prof,pr,att,fors]=await Promise.all([med?FB.myGroups(u.email):[],ikkeAdm?FB.myLeads(u.email):[],ikkeAdm?FB.myLeder(u.email):false,ikkeAdm?FB.myProfile(u.email):null,med?FB.myPrefs(u.email.toLowerCase()):null,med?FB.getAttest(u.email.toLowerCase()).catch(()=>null):null,med?FB.getForslag(u.email.toLowerCase()).catch(()=>null):null]);
    state.attest=att;state.attFors=fors;state.attester=undefined;
    if(fors&&fors.okM&&fors.okL)FB.attFullfor(u.email.toLowerCase()).then(()=>attOppfrisk(u.email.toLowerCase())).catch(()=>{});
    state.groups=grp;state.leads=lds;state.leder=ldr;state.profile=prof;
    state.ltype=state.leder?((await FB.myLtype(u.email))||''):'';
    state.meorder=null;state.homeorder=null;if(pr&&Array.isArray(pr.meorder))state.meorder=pr.meorder;if(pr&&Array.isArray(pr.homeorder))state.homeorder=pr.homeorder;
    // Rekkefølgen på undermenyene følger brukeren (userPrefs.suborder). Finnes den i databasen, brukes den; ellers sendes den som er lagret på enheten opp.
    if(pr&&typeof pr.suborder==='string'){try{JSON.parse(pr.suborder);lsSet(SUBORD_KEY,pr.suborder)}catch(e){}}else if(med&&lsGet(SUBORD_KEY)){FB.setPrefSub(u.email.toLowerCase(),lsGet(SUBORD_KEY)).catch(()=>{})}
    state.notes=undefined;state.shifts=undefined;state.reqs=undefined;state.myShifts=[];
    if(u&&state.member){loadMyShifts().then(()=>keep(()=>{}));setTimeout(utSjekkNye,1500)}
    thrStopp();state.thrPromise=null;state.threads=undefined;if(!u&&state.chat.vis)chatLukk();state.roles=undefined;if(u&&state.member){loadThreads();loadVaktReq();if(lrTilgang())loadLr()}
    if(u&&lsGet('sm-push'))FB.linkPush(lsGet('sm-push')).catch(()=>{});
    try{u?localStorage.setItem('sm-innlogget','1'):localStorage.removeItem('sm-innlogget')}catch(er){}
    await load();state.fast=false;state.authVent=false;
    if(first){first=false;if(state.tab==='news')markSeen();render();splashBort()}else keep(()=>{});
    if(!u)bonnForhent();
  };
  if(FB)FB.onAuth(u=>go(u).catch(()=>{state.fast=false;state.authVent=false;$('#view').textContent='Kunne ikke laste program. Prøv igjen senere.';splashBort()}));
  else{await load();state.fast=false;state.authVent=false;first=false;render();splashBort()}
}
start().catch(()=>{$('#view').textContent='Kunne ikke laste program. Prøv igjen senere.';splashBort()});
// Kald start fra et trykk på et varsel: gå til stedet varselet gjelder når innholdet er lastet (prøver noen ganger).
if(state.pendingVarsel){[900,2500,5000,9000].forEach(ms=>setTimeout(()=>{const p=state.pendingVarsel;if(p&&!first&&apneFraVarsel(p.tab,p.tittel,p.tekst))state.pendingVarsel=null},ms))}
if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js').catch(()=>{});hentVarselFraSW();
  setInterval(()=>{if(!document.hidden)hentVarselFraSW()},15000);   // reserve: sjekker det lokale varsellageret mens appen er åpen
  navigator.serviceWorker.addEventListener('message',e=>{const d=e.data||{};
    if(d.type==='push'){varselLagre(d.title,d.body);lsSet('sm-viktig-skjult','');keep(()=>{});nyMelding();return}   // varsel kom mens appen var åpen
    if(d.type!=='open-tab')return;

    if(!apneFraVarsel(d.tab,d.title,d.body)&&['home','prog','news','me'].includes(d.tab)){state.tab=d.tab;if(d.tab==='news')markSeen();render()}
    nyMelding()})}
