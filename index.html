/* Messenger-lignende utseende */
/* Chatvinduet er hvitt eller svart etter valgt tema i appen (lys/mørk-knappen). Står temaet på automatisk, følger det telefonen. */
.chat{--bg:#fff;--surface:#fff;--ink:#050505;--muted:#65676b;--line:#e4e6eb;--chip:#f0f2f5;color:#050505;color-scheme:light}
.chat .cw{background:#fff;color:var(--ink)}
  .chat[data-mork="1"]{--bg:#000;--surface:#000;--ink:#e4e6eb;--muted:#b0b3b8;--line:#2d2e30;--chip:#242526;color:#e4e6eb;color-scheme:dark;background:#000}
  .chat[data-mork="1"] .cw{background:#000}
  .chat[data-mork="1"] .cb.de{background:#3a3b3c;color:#e4e6eb}
  .chat[data-mork="1"] .cinp textarea,.chat[data-mork="1"] .csokl input{background:#242526;color:#e4e6eb}
.cmsg{padding:10px 10px 4px;gap:1px}
.crow{display:flex;align-items:flex-end;gap:6px;max-width:100%}
.crow.me{justify-content:flex-end}
.crow .cb{align-self:auto;max-width:76%;line-height:1.3;padding:8px 12px}
.cb.me{background:#0084ff;color:#fff;border:0;border-radius:18px}
.cb.de{background:#e4e6eb;color:#050505;border:0;border-radius:18px}
.cb.me.sf{border-top-right-radius:5px}.cb.me.sn{border-bottom-right-radius:5px}
.cb.de.sf{border-top-left-radius:5px}.cb.de.sn{border-bottom-left-radius:5px}
.cavt{width:28px;flex:none}
.cbprev .cav{width:96px;height:96px;font-size:34px}
.cav img{width:100%;height:100%;border-radius:50%;object-fit:cover;display:block}
.cav.sm{width:28px;height:28px;font-size:11px}
.ct.de{margin-left:36px}
.sione{display:inline-block;vertical-align:-.2em;width:1.25em;height:1.25em;background-color:currentColor;-webkit-mask:url(logo-512.png) center/contain no-repeat;mask:url(logo-512.png) center/contain no-repeat}
.sione.sort{background-color:#000;filter:drop-shadow(0 0 1px rgba(255,255,255,.9))}
.sione.hvit{background-color:#fff;filter:drop-shadow(0 0 1.5px rgba(0,0,0,.8))}
.cb.cstor .sione.sort,.cb.cstor .sione.hvit{color:inherit}
.cb.cstor .sione{width:46px;height:46px;color:#0084ff;vertical-align:middle}
.cb.cstor{background:transparent!important;font-size:34px;padding:0 4px;line-height:1.1}
.chat .cb.cbild{background:transparent!important;padding:0;border-radius:0}

.cb.cbild .cnvn{padding:0 2px}
.cqt{border-left:3px solid rgba(255,255,255,.75);padding:2px 8px;margin:0 0 5px;font-size:var(--t-s);opacity:.9;display:flex;flex-direction:column}
.cb.de .cqt{border-left-color:#0084ff}
.cqt span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:46vw}
.cimg{display:block;max-width:100%;max-height:300px;border-radius:12px;margin:0 0 4px;cursor:zoom-in}
.cbar{display:flex;align-items:center;gap:8px;padding:6px 12px;border-top:1px solid var(--line);background:var(--surface)}
.cbar[hidden],.cemoji[hidden]{display:none}
.cbar .cbt{flex:1;min-width:0;display:flex;flex-direction:column;font-size:var(--t-s);border-left:3px solid #0084ff;padding-left:8px}
.cbar .cbt span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--muted)}
.cbar2{gap:12px;padding:12px 14px;background:var(--chip);border-radius:18px 18px 0 0;border-top:0;box-shadow:0 -4px 18px rgba(0,0,0,.18)}
.cbar2 .cbik{flex:none;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:var(--line);color:var(--lamp,var(--brand))}
.cbar2 .cbt{border-left:0;padding-left:0;font-size:var(--t-m);gap:2px}
.cbar2 .cbt b{font-size:var(--t-m)}
.cbar2 .cbt span{white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

.cemoji{display:block;padding:8px 14px 16px;background:var(--surface);border-top:0;border-radius:22px 22px 0 0;box-shadow:0 -1px 0 var(--line),0 -10px 30px rgba(15,40,70,.08);max-height:300px;overflow:auto}
/* Rolig, voksen utforming: små overskrifter, nedtonede fliser og tynne omriss i stedet for fargede piller. */
.cegrep{display:block;width:36px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 6px}
.cetit{font-size:var(--t-xs);font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:12px 2px 6px}
.cemoji .cegrid.cstikk button,.cemoji .cst{background:var(--chip);border-radius:14px;padding:6px 0;transition:background .2s ease}
.cemoji .cegrid.cstikk button:active,.cemoji .cst:active{background:color-mix(in srgb,var(--brand) 14%,var(--chip))}
.cegrid.cstikk{grid-template-columns:repeat(5,1fr);gap:8px}
.cegrid.cstikk2{gap:8px;margin:8px 0}
.cemoji .cmal{background:transparent;border:1px solid var(--line);color:var(--ink);font-weight:500;padding:7px 14px;transition:background .2s ease,border-color .2s ease}

.cegrid{display:grid;grid-template-columns:repeat(8,1fr);gap:2px}
.cegrid.cstikk2{grid-template-columns:repeat(5,1fr);margin:4px 0}
.cemoji .cst{display:grid;place-items:center}
.cmalrad{display:flex;flex-wrap:wrap;gap:6px;padding:6px 0}
.cemoji .cmal{background:var(--chip);color:var(--ink);padding:6px 12px;border-radius:99px;font-size:var(--t-s);font-weight:600;cursor:pointer}
/* Sion-klistremerker (logoen med tegnede tillegg) */

.ceff{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:6}
.chat .cw{position:relative;touch-action:pan-y}   /* vannrette drag går til oss (sveip tilbake), ikke til nettleseren, så Android ikke avbryter sveipet */

html[data-bred="1"] .chat,html[data-bred="1"] .chat[data-mork="1"]{background:var(--bg-app)}
.cemoji button{all:unset;font-size:24px;text-align:center;padding:4px;cursor:pointer;border-radius:8px}
.cinp{gap:2px;padding:8px 8px}

/* Ingen farget ramme rundt tekstfeltene i chatten når du skriver. */

.cinp{align-items:center;gap:4px}
.cverk{display:flex;align-items:center;gap:0;flex:none}

.csend{background:transparent;color:#0084ff;width:40px;height:40px}
.chat .cb.me{background:var(--cfarge,var(--brand));color:var(--cfarge-ink,var(--brand-ink))}

.cik[hidden]{display:none}

function when(d){const diff=Math.round((new Date(d).setHours(0,0,0,0)-new Date(now).setHours(0,0,0,0))/864e5);
  return diff===0?'I dag':diff===1?'I morgen':cap(DAYS[d.getDay()])}
function dateBox(ev){const d=ev.w,e=ev.e;const m=cap(MON[d.getMonth()]);const s=e&&e.getTime()!==new Date(d).setHours(23,59,0,0)?`${d.getDate()}.${e.getMonth()===d.getMonth()?'-'+e.getDate()+'. '+m:' '+m+'-'+e.getDate()+'. '+cap(MON[e.getMonth()])}`:`${d.getDate()}. ${m}`;const yr=d.getFullYear()!==now.getFullYear()?`<br><span style="font-size:var(--t-s);opacity:.8">${d.getFullYear()}</span>`:'';return `<div class="date">${s.replace('.-','.–')}${yr}</div>`}

/* Neste forekomst av hver fast samling. Unntak (r.ex[dato]): fjernet = hoppes over, avlyst = vises som avlyst (og neste gang vises også), endret = nytt klokkeslett og/eller merknad. */

function isoUke(d){const t=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())),dag=t.getUTCDay()||7;t.setUTCDate(t.getUTCDate()+4-dag);const y0=new Date(Date.UTC(t.getUTCFullYear(),0,1));return Math.ceil(((t-y0)/864e5+1)/7)}
function ukeValg(r){const v=String(r.weeks||'').toLowerCase(),n=String(r.note||'').toLowerCase();
  if(/måned/.test(v)||(!v&&/ca[. ]*[eé]n gang i måneden|månedlig/.test(n)))return 'maned';

  if(/oddetall/.test(v)||(!v&&/oddetallsuke/.test(n)))return 'oddetall';
  return 'alle'}
const ukeOK=(r,w)=>{const v=ukeValg(r);if(v==='maned')return false;return v==='alle'||(isoUke(w)%2===0)===(v==='partall')};

const norm=t=>String(t||'').toLowerCase();
function progMatch(x,q){
  if(!q)return true;

  let hay;
  if(x.ev){const e=x.ev;hay=(e.m&&!state.member)?norm(e.title):norm([e.title,e.place,e.who,e.text,e.cat,e.start,DAYS[e.w.getDay()],MON[e.w.getMonth()]].join(' '))}
  else{const r=x.fast;hay=norm([r.title,r.note,r.cat,DAYS[r.day],'fast',x.w.getDate()+'. '+MON[x.w.getMonth()]].join(' '))}
  return ord.every(o=>hay.includes(o))}

/* Grupper: opprett, endre navn og slett. Første endring lagrer standardgruppene i databasen. */
const slug=n=>String(n).toLowerCase().replace(/æ/g,'ae').replace(/ø/g,'o').replace(/å/g,'a').replace(/[^a-z0-9]+/g,'').slice(0,30)||'gruppe';
/* Hver gruppe er en rad som åpnes og viser medlemmene (og lederne) rett i gruppen. */
const grpNavn=u=>u.name||u.id,grpSort=(a,b)=>grpNavn(a).localeCompare(grpNavn(b),'nb');
const grpMedl=u=>'<div class="r grm"><div class="grow">'+esc(grpNavn(u))+(u.name?'<span class="small" style="display:block">'+esc(u.id)+'</span>':'')+'</div>'+(u.role==='admin'?'<span class="tag m">Administrator</span>':'')+'</div>';
function grpRad(g){
  const id=g[0],med=members.filter(u=>(u.groups||[]).includes(id)||(u.leads||[]).includes(id)).sort(grpSort),ledere=med.filter(u=>(u.leads||[]).includes(id)),vanlige=med.filter(u=>!(u.leads||[]).includes(id));

    +(ledere.length?'<p class="small" style="margin:0 0 4px"><b>Ledere ('+ledere.length+')</b></p><div class="reg">'+ledere.map(grpMedl).join('')+'</div>':'')
    +'<p class="small" style="margin:8px 0 4px"><b>Medlemmer ('+vanlige.length+')</b></p><div class="reg">'+(vanlige.map(grpMedl).join('')||'<p class="small">Ingen ennå. Legg dem til under Brukere eller Tilhørighet og varsler.</p>')+'</div>'
    +'<div class="btns" style="margin-top:10px"><button class="btn" data-grpedit="'+esc(id)+'">Endre gruppen</button><button class="btn" data-grpdel="'+esc(id)+'">Slett gruppen</button></div></details>'}
function grpUten(){
  const u=members.filter(x=>!(x.groups||[]).length&&!(x.leads||[]).length).sort(grpSort);
  return u.length?'<details class="acc sub grp" data-acc="gr__uten" '+(state.acc.gr__uten?'open':'')+'><summary><h3 style="font-size:var(--t-l)">Ikke i noen gruppe <span class="small">('+u.length+')</span></h3><span class="small" style="display:block">Brukere som ennå ikke er satt i en gruppe</span></summary><div class="reg">'+u.map(grpMedl).join('')+'</div></details>':''}
function groupsCard(){
  return `<details class="card acc" data-acc="grupper" ${state.acc.grupper?'open':''}><summary><h2>Grupper (${GROUPS.length})</h2></summary>
  <p class="small" style="margin:0 0 8px">Trykk på en gruppe for å se hvem som er med. Grupper brukes til å velge hvem som ser et arrangement eller en nyhet, og hvem en gruppeleder leder. Endrer du navnet, gjelder det overalt. Sletter du en gruppe, tas den ut av alle brukere, og innhold som bare var for gruppen blir «Bare medlemmer».</p>
  <button class="btn primary" data-grpnew style="width:auto">+ Ny gruppe</button>

async function grpSeed(){
  if(state.grDb)return;
  let i=0;for(const g of GROUPS_DEFAULT){await FB.setGroupDoc(g[0],{name:g[1],desc:g[2]||'',ord:i++,vakt:grVakt(g[0]),remind:grRemind(g[0])})}
  applyGroups(await FB.groupsList())}
function grpAsk(id){
  if(!FB)return;
  const g=id?GROUPS.find(x=>x[0]===id):null,dlg=document.createElement('dialog');dlg.className='lp';
  dlg.innerHTML='<form class="form" method="dialog"><h3 style="margin:0">'+(g?'Endre gruppe':'Ny gruppe')+'</h3><label class="f">Navn<input id="gN" maxlength="40" value="'+esc(g?g[1]:'')+'"></label><label class="f">Beskrivelse (valgfritt)<input id="gD" maxlength="40" placeholder="for eksempel ungdom" value="'+esc(g?g[2]:'')+'"></label>'
   +'<label style="display:flex;gap:8px;align-items:center;font-weight:400"><input type="checkbox" id="gV" style="width:22px;height:22px;flex:none" '+((g?grVakt(g[0]):true)?'checked':'')+'>Gruppen har vaktliste (under Mer → Vakter)</label>'
   +'<label style="display:flex;gap:8px;align-items:center;font-weight:400"><input type="checkbox" id="gP" style="width:22px;height:22px;flex:none" '+((g?grRemind(g[0]):false)?'checked':'')+'>Automatisk påminnelse dagen før samlinger for gruppen</label><p class="small" role="status" id="gMsg" style="margin:0"></p><div class="btns"><button class="btn primary" value="lagre" style="width:auto">Lagre</button><button class="btn" value="avbryt" formnovalidate>Avbryt</button></div></form>';
  document.body.appendChild(dlg);
  const f=dlg.querySelector('form');
  f.addEventListener('submit',async e=>{
    if(e.submitter&&e.submitter.value!=='lagre')return;
    e.preventDefault();
    const n=dlg.querySelector('#gN').value.trim().replace(/\s+/g,' '),d=dlg.querySelector('#gD').value.trim();
    if(!n){dlg.querySelector('#gMsg').textContent='Skriv et navn.';return}
    if(GROUPS.some(x=>x[0]!==id&&x[1].toLowerCase()===n.toLowerCase())){dlg.querySelector('#gMsg').textContent='Det finnes allerede en gruppe med dette navnet.';return}
    try{
      await grpSeed();
      const vakt=dlg.querySelector('#gV').checked,remind=dlg.querySelector('#gP').checked;
      if(g)await FB.setGroupDoc(id,{name:n,desc:d,vakt,remind});
      else{let nid=slug(n),k=2;while(GR_IDS.includes(nid))nid=slug(n)+(k++);await FB.setGroupDoc(nid,{name:n,desc:d,ord:GROUPS.length,vakt,remind})}
      dlg.close();await refresh();push(g?'Gruppen er endret':'Gruppen er opprettet',n)}
    catch(er){dlg.querySelector('#gMsg').textContent=saveMsg(er&&er.code)+' (Er de nye reglene publisert i Firebase?)'}});
  dlg.addEventListener('close',()=>dlg.remove());
  dlg.showModal();
}
function grpDel(id){
  const g=GROUPS.find(x=>x[0]===id);if(!g||!FB)return;
  const ev=rawEvents.filter(e=>(e.groups||[]).includes(id)),po=posts.filter(p=>(p.groups||[]).includes(id)),br=members.filter(u=>(u.groups||[]).includes(id)||(u.leads||[]).includes(id));
  const dlg=document.createElement('dialog');dlg.className='lp';
  dlg.innerHTML='<form class="form" method="dialog"><h3 style="margin:0">Slette gruppen «'+esc(g[1])+'»?</h3><p class="small" style="margin:0">Den brukes av '+ev.length+' arrangement'+(ev.length===1?'':'er')+', '+po.length+' nyhet'+(po.length===1?'':'er')+' og '+br.length+' bruker'+(br.length===1?'':'e')+'. Gruppen tas ut av dem. Innhold som bare var for denne gruppen blir «Bare medlemmer». Ingenting slettes ellers.</p><div class="btns col"><button class="btn danger" value="slett">Slett gruppen</button><button class="btn" value="avbryt">Avbryt</button></div></form>';
  document.body.appendChild(dlg);
  dlg.addEventListener('close',async()=>{const ok=dlg.returnValue==='slett';dlg.remove();if(!ok)return;
    try{
      try{await FB.ensureSnapshot('Før sletting av gruppe',5*60e3)}catch(er){if(!await bekreft('Kunne ikke lage et sikkerhetspunkt ('+((er&&er.code)||'feil')+'). Fortsette likevel?'))return}
      await grpSeed();
      const rest=GROUPS.filter(x=>x[0]!==id);
      for(const e of ev)await FB.set('events',e.id,{groups:(e.groups||[]).filter(x=>x!==id)});
      for(const p of po){const gs=(p.groups||[]).filter(x=>x!==id);await FB.set('posts',p.id,gs.length?{groups:gs,audience:gs,tag:gs.map(x=>(rest.find(r=>r[0]===x)||[x,x])[1]).join(' · '),m:true}:{groups:[],audience:['Medlem'],tag:'Medlem',m:true})}
      for(const u of br){const gs=(u.groups||[]).filter(x=>x!==id),ls=(u.leads||[]).filter(x=>x!==id);
        if(u.role==='admin')await FB.setGroups(u.id,'admin',gs);else if((u.leads||[]).includes(id))await FB.setLeads(u.id,ls,gs);else await FB.setGroups(u.id,'member',gs)}
      await FB.delGroupDoc(id);await refresh();push('Gruppen er slettet','«'+g[1]+'» er fjernet.')}
    catch(er){push('Kunne ikke slette',saveMsg(er&&er.code))}});
  dlg.showModal();
}
/* Lederkategorier (Hovedledere, Ungdomsledere, Forkynnere og egne): deler opp rollen «Leder» under Brukere. Lagres i samlingen leaderTypes første gang administrator endrer noe. */
const LTYPES_DEFAULT=[['hoved','Hovedledere'],['ungdom','Ungdomsledere'],['forkynner','Forkynnere']];
const LTYPES=LTYPES_DEFAULT.map(t=>t.slice());
function applyLtypes(l){
  const src=l&&l.length?l.slice().sort((a,b)=>((a.ord==null?999:a.ord)-(b.ord==null?999:b.ord))||String(a.name).localeCompare(String(b.name))).map(t=>[t.id,t.name]):LTYPES_DEFAULT.map(t=>t.slice());
  LTYPES.length=0;src.forEach(t=>LTYPES.push(t));state.ltDb=!!(l&&l.length)}
const ltOf=x=>LTYPES.some(t=>t[0]===x.ltype)?x.ltype:LTYPES[0][0];
const ltName=x=>(LTYPES.find(t=>t[0]===ltOf(x))||['','Leder'])[1];
const ltSelect=x=>'<label class="small" style="display:block;margin-top:4px">Lederkategori <select data-ltsel="'+esc(x.id)+'" style="width:auto;padding:4px 8px">'+LTYPES.map(t=>'<option value="'+esc(t[0])+'" '+(ltOf(x)===t[0]?'selected':'')+'>'+esc(t[1])+'</option>').join('')+'</select></label>';
async function ltSeed(){
  if(state.ltDb)return;
  let i=0;for(const t of LTYPES_DEFAULT)await FB.setLtypeDoc(t[0],{name:t[1],ord:i++});
  applyLtypes(await FB.ltypesList())}
function ltAsk(id){
  if(!FB)return;
  const t=id?LTYPES.find(x=>x[0]===id):null,dlg=document.createElement('dialog');dlg.className='lp';
  dlg.innerHTML='<form class="form" method="dialog"><h3 style="margin:0">'+(t?'Endre lederkategori':'Ny lederkategori')+'</h3><label class="f">Navn (for eksempel «Forkynnere»)<input id="ltN" maxlength="40" value="'+esc(t?t[1]:'')+'"></label><p class="small" role="status" id="ltMsg" style="margin:0"></p><div class="btns"><button class="btn primary" value="lagre" style="width:auto">Lagre</button><button class="btn" value="avbryt" formnovalidate>Avbryt</button></div></form>';
  document.body.appendChild(dlg);
  dlg.querySelector('form').addEventListener('submit',async e=>{
    if(e.submitter&&e.submitter.value!=='lagre')return;
    e.preventDefault();
    const n=dlg.querySelector('#ltN').value.trim().replace(/\s+/g,' ');
    if(!n){dlg.querySelector('#ltMsg').textContent='Skriv et navn.';return}
    if(LTYPES.some(x=>x[0]!==id&&x[1].toLowerCase()===n.toLowerCase())){dlg.querySelector('#ltMsg').textContent='Det finnes allerede en kategori med dette navnet.';return}
    try{
      await ltSeed();
      if(t)await FB.setLtypeDoc(id,{name:n});
      else{let nid=slug(n),k=2;while(LTYPES.some(x=>x[0]===nid))nid=slug(n)+(k++);await FB.setLtypeDoc(nid,{name:n,ord:LTYPES.length});state.acc['lt_'+nid]=true}
      state.acc.b_ld=true;dlg.close();await refresh();push(t?'Navnet er endret':'Kategorien er opprettet',n)}
    catch(er){dlg.querySelector('#ltMsg').textContent=saveMsg(er&&er.code)+' (Er de nye reglene publisert i Firebase?)'}});
  dlg.addEventListener('close',()=>dlg.remove());
  dlg.showModal();
}
async function ltDel(id){
  const t=LTYPES.find(x=>x[0]===id);if(!t)return;
  if(LTYPES.length<2){push('Ikke mulig','Det må finnes minst én lederkategori.');return}
  const hit=members.filter(x=>x.leder&&ltOf(x)===id),til=LTYPES.find(x=>x[0]!==id);
  if(!await bekreft('Slette lederkategorien «'+t[1]+'»?'+(hit.length?'\n\n'+hit.length+' leder'+(hit.length===1?'':'e')+' flyttes til «'+til[1]+'». De er fortsatt ledere.':'')))return;
  try{
    await ltSeed();
    for(const u of hit)await FB.setLtype(u.id,til[0]);
    await FB.delLtypeDoc(id);await refresh();push('Kategorien er slettet','«'+t[1]+'» er fjernet.')}
  catch(er){push('Kunne ikke slette',saveMsg(er&&er.code))}
}

/* Sender velkomst-e-post til nylig opprettede brukere via varseltjenesten. Returnerer en kort tekst til meldingen. */

function utEndringer(a,b){
  const o=[];let kritisk=false;
  if(a.dato!==b.dato||(a.dato2||'')!==(b.dato2||'')||a.fra!==b.fra||a.til!==b.til||JSON.stringify(a.tider||[])!==JSON.stringify(b.tider||[])){o.push('Når: '+utTidKort(a)+' → '+utTidKort(b));kritisk=true}
  if((a.rom||[]).join(', ')!==(b.rom||[]).join(', ')){o.push('Rom: '+((a.rom||[]).join(', ')||'–')+' → '+((b.rom||[]).join(', ')||'–'));kritisk=true}
  if((Number(a.gjester)||0)!==(Number(b.gjester)||0))o.push('Gjester: '+(a.gjester||'–')+' → '+(b.gjester||'–'));
  if((a.servering||'')!==(b.servering||''))o.push('Servering: '+(a.servering||'–')+' → '+(b.servering||'–'));
  const al=x=>[...(x.allergener||[]),x.allergenNotat].filter(Boolean).join(', ');
  if(al(a)!==al(b))o.push('Allergener: '+(al(a)||'–')+' → '+(al(b)||'–'));

    mr.ondataavailable=e=>{if(e.data&&e.data.size)r.chunks.push(e.data)};

/* Personvernerklæring (vises under Mer for innloggede). Administrator kan endre teksten i appen (settings/personvern). Enkel skrivemåte:
   «## Overskrift», «- punkt», tom linje mellom avsnitt og **fet**. Standardteksten under brukes til noe er lagret. Hold den i samsvar med behandlingsoversikten (personvern/ utenfor repoet). */
const PV_STD_DATO='2026-10-20';
const PV_STD=`## Hvem er ansvarlig?
**Pinsemenigheten Sion Molde og omegn** (org.nr. 976 222 253), Kometvegen 7, 6419 Molde, er ansvarlig for personopplysningene i appen. Kontakt oss om personvern: post@sionmolde.no eller telefon 71 25 10 29.

## Hva lagrer vi, og hvorfor?
- **Innlogging:** e-postadresse og passord. Passordet lagres kryptert i databasen, og vi kan ikke se det. For at du skal få tilgang.
- **Medlemsliste:** e-post, navn hvis du har lagt det inn, grupper og rolle. For å gi riktig innhold og varsler. Administratorer og gruppeledere (for sine grupper) ser dette.
- **«Jeg kommer»:** navn og kontaktopplysning du skriver inn. Ledere ser hvem som kommer. Svarene lagres også i et regneark hos Google Drive.
- **Møtenotater:** dine private notater. Bare du kan lese dem, ikke engang administratorer.
- **Forbønn:** teksten, navn og tidspunkt. Bare administratorer og de som leder bønnemøtene ser dem. Innloggede sender med navn. Uten innlogging sendes de anonymt.
- **Beskjeder:** meldinger mellom deg og de ansvarlige. Bare deltakerne i samtalen ser dem.
- **Vakter:** navn og e-post på vaktlisten. Gruppens medlemmer og leder ser den.
- **Varselkode:** en kode for telefonen din, koblet til e-posten din hvis du er innlogget, så vi kan sende varsler du har bedt om.
- **Nyhetsbrev Sommerstevne:** e-postadressen din, i et regneark hos Google Drive, bare til informasjon om sommerstevnet.
- **Politiattest:** datoen attesten ble utstedt og, hvis du velger det, selve dokumentet (bilde eller PDF). Dato og dokument gjelder først når både du og gruppelederen din har bekreftet, og endring eller sletting må også bekreftes av begge. Bare du, gruppelederen din og administratorene ser den. Den slettes hvis du eller begge parter sletter den, og når du sletter deg selv.
- **Innstillinger:** rekkefølge på kort og tekststørrelse. Noe lagres bare på telefonen din.

Vi bruker ikke annonser eller sporing, og vi selger eller deler ikke opplysninger med andre. Dataene lagres og driftes hos Google på våre vegne.

## Sensitive opplysninger
At noen tilhører en menighet, og forbønner som kan handle om tro eller helse, regnes som særlig sensitive opplysninger. Vi behandler opplysninger om medlemmer og andre med jevnlig kontakt bare i menighetens virksomhet, og gir dem ikke videre utenfor menigheten uten samtykke. Forbønner sender du inn frivillig, og du kan slette dem når som helst. **Skriv ikke inn helseopplysninger om andre uten at de har sagt ja.**

## Hvor lenge lagrer vi?
- Medlemmer: så lenge du er med. Du kan slette deg selv når som helst.
- Forbønn: vises i en uke og slettes automatisk etter 30 dager.
- «Jeg kommer» i appen: slettes automatisk 90 dager etter arrangementet. Svar i regnearkene slettes når du ber om det.
- Beskjeder: slettes automatisk etter ett år uten bruk.
- Møtenotater: til du sletter dem eller sletter deg selv.
- Nyhetsbrev: til du ber om å bli fjernet.

## Dine rettigheter
Du kan be om **innsyn**, **retting**, **sletting**, begrensning og å trekke tilbake samtykke. Under Mer → Min profil kan du **laste ned alt appen har lagret om deg** og **slette deg selv** med dataene dine (konto, notater, forbønner og samtaler du har startet). Trenger du hjelp, send e-post til post@sionmolde.no. Vi svarer innen 30 dager. Mener du at vi ikke følger reglene, kan du klage til Datatilsynet: https://www.datatilsynet.no

## Barn
Appen er ikke laget for barn under 13 år, og vi registrerer ikke opplysninger om barn under 13 år. Ledere skal ikke legge dem inn. Oppdager vi det, sletter vi opplysningene.

## Sikkerhet
Dataene lagres hos Google og overføres kryptert. Databasen har regler for hvem som kan lese og endre hva. Beskjeder og forbønner er ikke ende-til-ende-krypterte, så ikke skriv noe svært sensitivt der. Hvis det skjer et avvik som kan skade deg, varsler vi deg og Datatilsynet i samsvar med loven.

## Lokal lagring
Appen lagrer innstillinger på telefonen din (for eksempel tekststørrelse og innlogging). Det er ikke sporing. Slår du på varsler, lagres en kode for telefonen din så varselsystemet kan nå den.`;

  String(t||'').split('\n').forEach(l=>{l=l.trimEnd();

const ATTEST_AAR=3,ATTEST_VARSEL_DAGER=60,ATTEST_MAKS=900000;

/* Leser en fil (bilde eller PDF) som tekst. Bilder krympes til en JPEG som får plass i databasen. */
function attFilLes(f){
  return new Promise((res,rej)=>{
    if(!f)return res(null);
    if(f.type==='application/pdf'){
      if(f.size>600*1024)return rej({msg:'PDF-en er for stor (maks 600 kB). Ta heller et bilde av attesten.'});
      const r=new FileReader();r.onload=()=>res({data:String(r.result),ftype:'application/pdf',fnavn:String(f.name||'politiattest.pdf').slice(0,80)});r.onerror=()=>rej({msg:'Kunne ikke lese filen.'});r.readAsDataURL(f);return}
    if(!/^image\//.test(f.type))return rej({msg:'Velg et bilde eller en PDF.'});
    const url=URL.createObjectURL(f),img=new Image();
    img.onload=()=>{URL.revokeObjectURL(url);let dim=1500,q=.82,data='';
      for(let i=0;i<8;i++){const s=Math.min(1,dim/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=Math.max(1,Math.round(img.width*s));c.height=Math.max(1,Math.round(img.height*s));
        const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(img,0,0,c.width,c.height);data=c.toDataURL('image/jpeg',q);
        if(data.length<=ATTEST_MAKS*.85)break;dim=Math.round(dim*.8);q=Math.max(.5,q-.06)}
      if(data.length>ATTEST_MAKS*.9)return rej({msg:'Bildet er for stort. Prøv et mindre bilde.'});
      res({data,ftype:'image/jpeg',fnavn:'politiattest.jpg'})};
    img.onerror=()=>{URL.revokeObjectURL(url);rej({msg:'Kunne ikke lese bildet.'})};img.src=url})}

const cHex=h=>{h=String(h||'').trim().replace('#','');if(h.length===3)h=h.split('').map(x=>x+x).join('');return /^[0-9a-f]{6}$/i.test(h)?'#'+h.toLowerCase():null};
const cRgb=h=>[1,3,5].map(i=>parseInt(h.slice(i,i+2),16));
const cHx=a=>'#'+a.map(v=>Math.max(0,Math.min(255,Math.round(v))).toString(16).padStart(2,'0')).join('');
const cMix=(a,b,t)=>{const x=cRgb(a),y=cRgb(b);return cHx(x.map((v,i)=>v*(1-t)+y[i]*t))};
const cLum=h=>{const [r,g,b]=cRgb(h).map(v=>{v/=255;return v<=.03928?v/12.92:Math.pow((v+.055)/1.055,2.4)});return .2126*r+.7152*g+.0722*b};
const cKon=(a,b)=>{const l1=cLum(a),l2=cLum(b);return (Math.max(l1,l2)+.05)/(Math.min(l1,l2)+.05)};
const cInk=h=>cKon(h,'#ffffff')>=cKon(h,'#111111')?'#ffffff':'#111111';

  let brand=c.brand,lamp=c.lamp;
  if(mork){if(cLum(brand)<.3)brand=cMix(brand,'#ffffff',.5);if(cLum(lamp)<.3)lamp=cMix(lamp,'#ffffff',.5)}else if(cLum(lamp)>.45)lamp=cMix(lamp,'#000000',.35);

function chatTraadFraVarsel(T,B){
  const meg=meEmail(),norm2=x=>String(x||'').toLowerCase().replace(/\s+/g,' ').trim(),
    nm=norm2((String(T).match(/^\s*ny beskjed(?: fra|:)\s*(.+)$/i)||[])[1]),tx=norm2(B).replace(/…$/,'').slice(0,40);

  if(!l.length)return null;
  const poeng=t=>{let p=0;const navn=norm2(chatNavn(t,meg));
    if(tx&&norm2(t.last).replace(/^du: /,'').includes(tx))p+=4;
    if(nm&&(navn.includes(nm)||nm.includes(navn)||norm2(t.fromName).includes(nm)||norm2(t.roleName).includes(nm)))p+=2;
    if((t.unread||[]).includes(meg))p+=2;return p};
  return l.slice().sort((a,b)=>poeng(b)-poeng(a)||(b.ms||0)-(a.ms||0))[0]}

/* ===== Felles sideovergang for alle faner i bunnmenyen (Hjem, Program, Nyheter, Sionchat, Mer) =====

   Kun transform + opacity (Web Animations). Raske trykk avbryter forrige overgang. Redusert bevegelse = rask fade. */
const OVG_MS=320,OVG_EASE='cubic-bezier(0.22, 1, 0.36, 1)',OVG_GLID=24;

function ovgRydd(){ovgAnim.forEach(a=>{try{a.cancel()}catch(e){}});ovgAnim=[];const l=ovgRydde;ovgRydde=[];l.forEach(f=>{try{f()}catch(e){}})}
function ovgInn(el,dir,rb){
  /* Skaleringen skjer rundt midten av det du ser, ikke midten av hele (høye) siden. Ellers flytter innholdet og toppen seg opp/ned under overgangen. */
  if(el.id==='view'){const r=el.getBoundingClientRect();el.style.transformOrigin='50% '+Math.round(innerHeight/2-r.top)+'px';ovgRydde.push(()=>{el.style.transformOrigin=''})}
  const a=rb?el.animate([{opacity:0},{opacity:1}],{duration:150,easing:'ease-out'})
    :el.animate([{opacity:0,transform:'translate3d('+dir*OVG_GLID+'px,0,0) scale(.98)'},{opacity:1,transform:'none'}],{duration:OVG_MS,easing:OVG_EASE});
  ovgAnim.push(a)}
function ovgUt(el,dir,ferdig){
  const a=el.animate([{opacity:1,transform:'none'},{opacity:0,transform:'translate3d('+(-dir*OVG_GLID)+'px,0,0) scale(.98)'}],{duration:OVG_MS,easing:OVG_EASE,fill:'forwards'});
  ovgAnim.push(a);a.onfinish=()=>{try{ferdig()}catch(e){}try{a.cancel()}catch(e){}}}
/* Et stillbilde av siden som forlates (en kopi av innholdet), som glir ut mens den nye glir inn. */

  w.style.cssText='position:fixed;overflow:hidden;pointer-events:none;z-index:4;left:'+r.left+'px;width:'+r.width+'px;top:'+topp+'px;height:'+Math.max(0,bunn-topp)+'px';
  const k=v.cloneNode(true);k.removeAttribute('aria-live');k.style.cssText='position:absolute;margin:0;left:0;width:'+r.width+'px;top:'+(r.top-topp)+'px;min-height:0';
  w.appendChild(k);document.body.appendChild(w);return w}

/* Større skjerm (nettbrett eller PC): spør én gang om appen skal utvides til hele bredden eller beholde den smale visningen. Valget lagres i Innstillinger → Utseende → Skjermvisning (UI.vis). */
/* Hold skjermen våken (Innstillinger → Skjerm): Screen Wake Lock så lenge appen er synlig. Slippes når appen skjules, og tas på nytt når den vises igjen. */
let vakenLaas=null;
async function vakenSett(){
  try{
    if(UI.vaken&&document.visibilityState==='visible'&&navigator.wakeLock){
      if(!vakenLaas){const l=await navigator.wakeLock.request('screen');vakenLaas=l;l.addEventListener('release',()=>{if(vakenLaas===l)vakenLaas=null})}}
    else if(vakenLaas){const l=vakenLaas;vakenLaas=null;await l.release()}
  }catch(e){vakenLaas=null}}
document.addEventListener('visibilitychange',vakenSett);
document.addEventListener('pointerdown',()=>{if(UI.vaken&&!vakenLaas)vakenSett()},{passive:true});
setTimeout(vakenSett,1500);
function skjermStor(){return innerWidth>=700&&Math.min(innerWidth,innerHeight)>=500}
function skjermSjekk(n){

  if((UI.vis||'auto')!=='auto'){lsSet('sm-skjerm-spurt','1');return}
  if(document.querySelector('dialog[open]')||first){if(n<6)setTimeout(()=>skjermSjekk(n+1),4000);return}
  const dlg=document.createElement('dialog');dlg.className='lp';dlg.setAttribute('role','alertdialog');
  dlg.innerHTML='<form class="form" method="dialog"><h3 style="margin:0">Større skjerm</h3><p class="small" style="margin:0">Appen ser ut til å kjøre på en større skjerm ('+innerWidth+' px bred). Vil du utvide appen til kanten av skjermen, eller beholde den smale visningen? Du kan endre det senere, og velge om menyen skal stå på siden eller nederst, under Mer → Meg → Innstillinger → Utseende.</p><div class="btns"><button class="btn primary" value="bred" style="flex:1">Utvid bredden</button><button class="btn" value="mobil" style="flex:1">Behold</button></div></form>';
  document.body.appendChild(dlg);
  dlg.addEventListener('close',()=>{const v=dlg.returnValue==='bred'?'bred':'mobil';dlg.remove();UI.vis=v;uiLagre();lsSet('sm-skjerm-spurt','1');settBred();keep(()=>{})});
