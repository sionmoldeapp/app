<script type="module" src="fb.js"></script>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const DAYS=['søndag','mandag','tirsdag','onsdag','torsdag','fredag','lørdag'];
const MON=['jan','feb','mar','apr','mai','jun','jul','aug','sep','okt','nov','des'];
const now=new Date();
const cap=s=>s[0].toUpperCase()+s.slice(1);
$('#today').textContent=cap(DAYS[now.getDay()])+' '+now.getDate()+'. '+MON[now.getMonth()];

/* Innhold hentes fra Firebase (Firestore). Hvis databasen er tom eller utilgjengelig, brukes
   JSON-filene i data/ som reserve. Innlogging og adminskjema bruker Firebase Authentication. */
let FB=null,usingFb=false;
let events=[],posts=[],regular=[],rawEvents=[],members=[],leaderMem=[],counts={},views={};
const todayStart=new Date(now);todayStart.setHours(0,0,0,0);
let seen=0;try{seen=+localStorage.getItem('sm-seen')||0}catch(e){}
const markSeen=()=>{seen=Date.now();try{localStorage.setItem('sm-seen',String(seen))}catch(e){}posts.forEach(p=>p.read=true);state.unread=0};
const isNew=p=>p.ms?p.ms>seen:!!(p.unread&&!p.read);
const getJson=f=>fetch('data/'+f+'.json').then(r=>r.json());
async function fetchAll(){
  if(FB){
    try{
      const [e,p,g]=await Promise.all([FB.list('events'),FB.list('posts'),FB.list('regular')]);
      if(e.length||p.length||g.length){usingFb=true;return [e,p,g]}
    }catch(err){console.warn('Firestore:',err)}
  }
  usingFb=false;
  return Promise.all([getJson('events'),getJson('posts'),getJson('regular').catch(()=>[])]);
}
async function load(){
  if(FB)try{applyGroups(await FB.groupsList())}catch(e){}
  if(FB)try{applyCats(await FB.catsList())}catch(e){}
  if(FB)try{const k=await FB.getContact();if(k)state.contact=k}catch(e){}
  if(FB&&state.user)try{state.pv=await FB.getPrivacy()}catch(e){}
  if(FB&&state.admin)try{applyLtypes(await FB.ltypesList())}catch(e){}
  const [e,p,g]=await fetchAll();
  rawEvents=e;
  events=e.filter(x=>canSee(x)&&canSeeCat(x.cat)&&liveOK(x)).map(x=>({...x,t:esc(x.title),d:linkify(esc(x.text)),w:new Date(x.start+'T'+(x.time||'00:00')),e:x.end?new Date(x.end+'T23:59'):null}))
    .filter(x=>(x.e||x.w)>=todayStart).sort((a,b)=>a.w-b.w);
  posts=p.filter(canSee).filter(liveOK).sort((a,b)=>(!!b.pinned-!!a.pinned)||((b.ms||0)-(a.ms||0)));   // festede nyheter først

const CATS_DEFAULT=['Møte','Samling','Ledersamling','Menighetsmøte','Happeninger','Ungdom'];

const fmtDT=ms=>{const d=new Date(ms),p=n=>String(n).padStart(2,'0');return d.getDate()+'. '+MON[d.getMonth()]+(d.getFullYear()!==new Date().getFullYear()?' '+d.getFullYear():'')+' kl. '+p(d.getHours())+':'+p(d.getMinutes())};

const effLeads=()=>state.view==='meg'?(state.leads||[]):[];
const effGroups=()=>state.view==='meg'?(state.groups||[]):[];

const lederKat=c=>LEDERKAT.includes(normCat(c));
const katSyn={   // hvem som ser hver intern kategori
  'Ledersamling':()=>effAdmin()||effLeder()||effLeads().length>0||effGroups().includes('lederradet'),
  'Lederrådet':()=>effAdmin()||effGroups().includes('lederradet')};
const canSeeCat=c=>{const f=katSyn[normCat(c)];return f?f():true};
/* «Vis som gruppeleder» (bare for administrator): vi bytter midlertidig ut rollen i appen med en gruppeleder for de valgte gruppene. Reglene i databasen gjelder fortsatt administratoren. */
function setView(v){
  if(state.real&&v!=='leder'){Object.assign(state,state.real);state.real=null}

    if(!state.real&&state.admin){state.real={admin:state.admin,leads:state.leads,groups:state.groups,leder:state.leder};state.admin=false;state.leder=false}

/* Grupper i menigheten: [id, navn, forklaring]. Samme id-er står i varsel-script.gs. Brukere plasseres i grupper under Brukere. */
const GROUPS_DEFAULT=[['sondagsskole','Søndagsskole','barnearbeid'],['activ8','Activ8','ungdom'],['hangout','Hangout','unge voksne'],['debora','Debora','kvinnearbeid'],['cdur','Sion C-dur','mannsfellesskap'],['kjokken','Kjøkken',''],['torsdagsgruppa','Torsdagsgruppa',''],['vertskap','Vertskap',''],['lederradet','Lederrådet',''],['ungdomsledere','Ungdomsledere',''],['sommerstevne','Sommerstevne',''],['elevate','Elevate',''],['lovsang','Lovsangsteamet','']];
/* Grupper: standardgruppene (over) til administrator redigerer første gang. Da lagres alle i databasen (samlingen groups) og listen leses derfra. GROUPS og GR_IDS endres på stedet, så alle som bruker dem får den nye listen. */
const GROUPS=GROUPS_DEFAULT.map(g=>g.slice());
const GR_IDS=GROUPS.map(g=>g[0]);
/* Gruppeinnstillinger: vakt = gruppen har vaktliste, remind = medlemmene får automatisk påminnelse dagen før samlinger for gruppen. */
const GR_REMIND_DEFAULT=['lederradet','ungdomsledere','torsdagsgruppa','vertskap','elevate','lovsang'];
const GR_FLAGS={};
const grVakt=id=>GR_FLAGS[id]?GR_FLAGS[id].vakt:!GR_REMIND_DEFAULT.includes(id);
const grRemind=id=>GR_FLAGS[id]?GR_FLAGS[id].remind:GR_REMIND_DEFAULT.includes(id);
function applyGroups(l){

async function grpSeed(){
  if(state.grDb)return;

  applyGroups(await FB.groupsList())}
function grpAsk(id){
  if(!FB)return;
  const g=id?GROUPS.find(x=>x[0]===id):null,dlg=document.createElement('dialog');dlg.className='lp';
  dlg.innerHTML='<form class="form" method="dialog"><h3 style="margin:0">'+(g?'Endre gruppe':'Ny gruppe')+'</h3><label class="f">Navn<input id="gN" maxlength="40" value="'+esc(g?g[1]:'')+'"></label><label class="f">Beskrivelse (valgfritt)<input id="gD" maxlength="40" placeholder="for eksempel ungdom" value="'+esc(g?g[2]:'')+'"></label>'
   +'<label style="display:flex;gap:8px;align-items:center;font-weight:400"><input type="checkbox" id="gV" style="width:22px;height:22px;flex:none" '+((g?grVakt(g[0]):true)?'checked':'')+'>Gruppen har vaktliste (under Meg → Vakter)</label>'
   +'<label style="display:flex;gap:8px;align-items:center;font-weight:400"><input type="checkbox" id="gP" style="width:22px;height:22px;flex:none" '+((g?grRemind(g[0]):false)?'checked':'')+'>Automatisk påminnelse dagen før samlinger for gruppen</label><p class="small" role="status" id="gMsg" style="margin:0"></p><div class="btns"><button class="btn primary" value="lagre" style="width:auto">Lagre</button><button class="btn" value="avbryt" formnovalidate>Avbryt</button></div></form>';
  document.body.appendChild(dlg);
  const f=dlg.querySelector('form');
  f.addEventListener('submit',async e=>{
    if(e.submitter&&e.submitter.value!=='lagre')return;

    const n=dlg.querySelector('#gN').value.trim().replace(/\s+/g,' '),d=dlg.querySelector('#gD').value.trim();

function grpDel(id){
  const g=GROUPS.find(x=>x[0]===id);if(!g||!FB)return;
  const ev=rawEvents.filter(e=>(e.groups||[]).includes(id)),po=posts.filter(p=>(p.groups||[]).includes(id)),br=members.filter(u=>(u.groups||[]).includes(id)||(u.leads||[]).includes(id));
  const dlg=document.createElement('dialog');dlg.className='lp';
  dlg.innerHTML='<form class="form" method="dialog"><h3 style="margin:0">Slette gruppen «'+esc(g[1])+'»?</h3><p class="small" style="margin:0">Den brukes av '+ev.length+' arrangement'+(ev.length===1?'':'er')+', '+po.length+' nyhet'+(po.length===1?'':'er')+' og '+br.length+' bruker'+(br.length===1?'':'e')+'. Gruppen tas ut av dem. Innhold som bare var for denne gruppen blir «Bare medlemmer». Ingenting slettes ellers.</p><div class="btns col"><button class="btn danger" value="slett">Slett gruppen</button><button class="btn" value="avbryt">Avbryt</button></div></form>';
  document.body.appendChild(dlg);
  dlg.addEventListener('close',async()=>{const ok=dlg.returnValue==='slett';dlg.remove();if(!ok)return;
    try{
      try{await FB.ensureSnapshot('Før sletting av gruppe',5*60e3)}catch(er){if(!await bekreft('Kunne ikke lage et sikkerhetspunkt ('+((er&&er.code)||'feil')+'). Fortsette likevel?'))return}
      await grpSeed();
      const rest=GROUPS.filter(x=>x[0]!==id);
      for(const e of ev)await FB.set('events',e.id,{groups:(e.groups||[]).filter(x=>x!==id)});
      for(const p of po){const gs=(p.groups||[]).filter(x=>x!==id);await FB.set('posts',p.id,gs.length?{groups:gs,audience:gs,tag:gs.map(x=>(rest.find(r=>r[0]===x)||[x,x])[1]).join(' · '),m:true}:{groups:[],audience:['Medlem'],tag:'Medlem',m:true})}
      for(const u of br){const gs=(u.groups||[]).filter(x=>x!==id),ls=(u.leads||[]).filter(x=>x!==id);
        if(u.role==='admin')await FB.setGroups(u.id,'admin',gs);else if((u.leads||[]).includes(id))await FB.setLeads(u.id,ls,gs);else await FB.setGroups(u.id,'member',gs)}
      await FB.delGroupDoc(id);await refresh();push('Gruppen er slettet','«'+g[1]+'» er fjernet.')}
    catch(er){push('Kunne ikke slette',saveMsg(er&&er.code))}});

/* Personvernerklæring (vises under Meg for innloggede). Administrator kan endre teksten i appen (settings/personvern). Enkel skrivemåte:
   «## Overskrift», «- punkt», tom linje mellom avsnitt og **fet**. Standardteksten under brukes til noe er lagret. Hold den i samsvar med behandlingsoversikten (personvern/ utenfor repoet). */
const PV_STD_DATO='2026-10-20';
const PV_STD=`## Hvem er ansvarlig?
**Pinsemenigheten Sion Molde og omegn** (org.nr. 976 222 253), Kometvegen 7, 6419 Molde, er ansvarlig for personopplysningene i appen. Kontakt oss om personvern: post@sionmolde.no eller telefon 71 25 10 29.

## Hva lagrer vi, og hvorfor?
- **Innlogging:** e-postadresse og passord. Passordet lagres kryptert hos Google Firebase, og vi kan ikke se det. For at du skal få tilgang.
- **Medlemsliste:** e-post, navn hvis du har lagt det inn, grupper og rolle. For å gi riktig innhold og varsler. Administratorer og gruppeledere (for sine grupper) ser dette.
- **«Jeg kommer»:** navn og kontaktopplysning du skriver inn. Ledere ser hvem som kommer. Svarene lagres også i et regneark hos Google Drive.
- **Møtenotater:** dine private notater. Bare du kan lese dem, ikke engang administratorer.
- **Bønneemner:** teksten, navn og tidspunkt. Bare administratorer og de som leder bønnemøtene ser dem. Innloggede sender med navn. Uten innlogging sendes de anonymt.
- **Beskjeder:** meldinger mellom deg og de ansvarlige. Bare deltakerne i samtalen ser dem.
- **Vakter:** navn og e-post på vaktlisten. Gruppens medlemmer og leder ser den.
- **Varselkode:** en kode for telefonen din, koblet til e-posten din hvis du er innlogget, så vi kan sende varsler du har bedt om.
- **Nyhetsbrev Sommerstevne:** e-postadressen din, i et regneark hos Google Drive, bare til informasjon om sommerstevnet.
- **Innstillinger:** rekkefølge på kort og tekststørrelse. Noe lagres bare på telefonen din.

Vi bruker ikke annonser eller sporing, og vi selger eller deler ikke opplysninger med andre.

## Sensitive opplysninger
At noen tilhører en menighet, og bønneemner som kan handle om tro eller helse, regnes som særlig sensitive opplysninger. Vi behandler opplysninger om medlemmer og andre med jevnlig kontakt bare i menighetens virksomhet, og gir dem ikke videre utenfor menigheten uten samtykke. Bønneemner sender du inn frivillig, og du kan slette dem når som helst. **Skriv ikke inn helseopplysninger om andre uten at de har sagt ja.**

## Hvem behandler dataene for oss?
Google (Firebase, Google Skjema, Regneark og Apps Script) lagrer og driver dataene for oss, og GitHub Pages viser appen. De behandler opplysningene på våre vegne.

## Hvor lenge lagrer vi?
- Medlemmer: så lenge du er med. Du kan slette deg selv når som helst.
- Bønneemner: vises i en uke og slettes automatisk etter 30 dager.
- «Jeg kommer» i appen: slettes automatisk 90 dager etter arrangementet. Svar i regnearkene slettes når du ber om det.
- Beskjeder: slettes automatisk etter ett år uten bruk.
- Møtenotater: til du sletter dem eller sletter deg selv.
- Nyhetsbrev: til du ber om å bli fjernet.

## Dine rettigheter
Du kan be om **innsyn**, **retting**, **sletting**, begrensning og å trekke tilbake samtykke. Under Meg → Min profil kan du **laste ned alt appen har lagret om deg** og **slette deg selv** med dataene dine (konto, notater, bønneemner og samtaler du har startet). Trenger du hjelp, send e-post til post@sionmolde.no. Vi svarer innen 30 dager. Mener du at vi ikke følger reglene, kan du klage til Datatilsynet: https://www.datatilsynet.no

## Barn
Appen er ikke laget for barn under 13 år, og vi registrerer ikke opplysninger om barn under 13 år. Ledere skal ikke legge dem inn. Oppdager vi det, sletter vi opplysningene.

## Sikkerhet
Dataene lagres hos Google og overføres kryptert. Databasen har regler for hvem som kan lese og endre hva. Beskjeder og bønneemner er ikke ende-til-ende-krypterte, så ikke skriv noe svært sensitivt der. Hvis det skjer et avvik som kan skade deg, varsler vi deg og Datatilsynet i samsvar med loven.

## Lokal lagring
Appen lagrer innstillinger på telefonen din (for eksempel tekststørrelse og innlogging). Det er ikke sporing. Slår du på varsler, lagres en kode for telefonen din så varselsystemet kan nå den.`;
function pvHtml(t){
  const inl=x=>linkify(esc(x)).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>');

  String(t||'').split('\n').forEach(l=>{l=l.trimEnd();
    if(/^##\s+/.test(l)){tøm();ut+='<h3 style="font-size:18px;margin:16px 0 6px">'+inl(l.replace(/^##\s+/,''))+'</h3>'}

/* Endre navn på eller slett en kategori. Arrangementer og faste samlinger får nytt navn, eller flyttes til en annen kategori ved sletting. Første endring lagrer kategoriene i databasen. */
async function catSeed(){
  if(state.catDb)return;
  let i=0;for(const c of allCats())await FB.setCatDoc(slug(c),{name:c,ord:i++});
  applyCats(await FB.catsList())}
function catAsk(navn){
  if(!FB||navn===CAT_LOCKED)return;
  const ev=rawEvents.filter(e=>normCat(e.cat)===navn),rg=regular.filter(r=>normCat(r.cat)===navn),n=ev.length+rg.length;
  const mål=allCats().filter(c=>c!==CAT_LOCKED&&c!==navn),dlg=document.createElement('dialog');dlg.className='lp';
  dlg.innerHTML='<form class="form" method="dialog"><h3 style="margin:0">Kategorien «'+esc(navn)+'»</h3><p class="small" style="margin:0">Brukes av '+ev.length+' arrangement'+(ev.length===1?'':'er')+' og '+rg.length+' fast'+(rg.length===1?'':'e')+' samling'+(rg.length===1?'':'er')+'.</p>'
   +'<label class="f">Nytt navn<input id="cN" maxlength="30" value="'+esc(navn)+'"></label><button class="btn primary" value="navn" style="width:auto">Lagre</button>'
   +'<hr style="border:0;border-top:1px solid var(--line);width:100%">'
   +'<b>Slette kategorien?</b>'+(n?'<label class="f">Flytt de '+n+' oppføringene til<select id="catTo">'+mål.map(c=>'<option value="'+esc(c)+'">'+esc(c)+'</option>').join('')+'</select></label>':'<span class="small">Ingen bruker den.</span>')
   +'<div class="btns col"><button class="btn danger" value="slett">Slett kategorien</button><button class="btn" value="avbryt">Avbryt</button></div></form>';
  document.body.appendChild(dlg);
  dlg.addEventListener('close',async()=>{
    const rv=dlg.returnValue,nytt=(dlg.querySelector('#cN').value||'').trim().replace(/\s+/g,' '),til=(dlg.querySelector('#catTo')||{}).value||'Møte';dlg.remove();
    if(rv!=='navn'&&rv!=='slett')return;
    try{
      if(rv==='navn'){
        if(!nytt||nytt===navn)return;
        if(allCats().some(c=>c.toLowerCase()===nytt.toLowerCase()&&c!==navn)){push('Finnes allerede','Det finnes en kategori som heter «'+nytt+'».');return}
        if(nytt.toLowerCase()===CAT_LOCKED.toLowerCase()){push('Ikke mulig','«'+CAT_LOCKED+'» er en spesiell kategori.');return}
        try{await FB.ensureSnapshot('Før endring av kategori',5*60e3)}catch(er){if(!await bekreft('Kunne ikke lage et sikkerhetspunkt ('+((er&&er.code)||'feil')+'). Fortsette likevel?'))return}
        await catSeed();
        const ord=(await FB.catsList()).find(c=>c.name===navn);
        for(const e of ev)await FB.set('events',e.id,{cat:nytt});
        for(const r of rg)await FB.set('regular',r.id,{cat:nytt});
        await FB.setCatDoc(slug(nytt)+(ord&&slug(nytt)===ord.id?'':''),{name:nytt,ord:ord&&ord.ord!=null?ord.ord:CATS.length});
        if(ord&&ord.id!==slug(nytt))await FB.delCatDoc(ord.id);
        if(state.filter===navn)state.filter=nytt;
        await refresh();push('Navnet er endret','«'+navn+'» heter nå «'+nytt+'».');return}
      try{await FB.ensureSnapshot('Før sletting av kategori',5*60e3)}catch(er){if(!await bekreft('Kunne ikke lage et sikkerhetspunkt ('+((er&&er.code)||'feil')+'). Fortsette likevel?'))return}
      await catSeed();
      for(const e of ev)await FB.set('events',e.id,{cat:til});
      for(const r of rg)await FB.set('regular',r.id,{cat:til});
      const dok=(await FB.catsList()).find(c=>c.name===navn);if(dok)await FB.delCatDoc(dok.id);
      if(state.filter===navn)state.filter='Alle';
      await refresh();push('Kategorien er slettet',n?n+' oppføring'+(n===1?'':'er')+' flyttet til «'+til+'».':'«'+navn+'» er fjernet.')}
    catch(er){push('Kunne ikke lagre',saveMsg(er&&er.code)+' (Er de nye reglene publisert i Firebase?)')}});
  dlg.showModal();
}
function fastAsk(id,dato){
  const r=regular.find(x=>x.id===id);if(!r||!FB)return;
  const ex=(r.ex||{})[dato]||null,d=new Date(dato+'T'+r.time),dn=cap(DAYS[d.getDay()])+' '+d.getDate()+'. '+MON[d.getMonth()],dlg=document.createElement('dialog');dlg.className='lp';
  const stat=ex?(ex.k==='avlyst'?'Avlyst denne gangen.':ex.k==='endret'?'Endret denne gangen'+(ex.time?': kl. '+ex.time:'')+(ex.note?' · '+ex.note:'')+'.':''):'';
  dlg.innerHTML='<form class="form" method="dialog" onkeydown="if(event.key===\'Enter\'&&event.target.tagName===\'INPUT\')event.preventDefault()"><h3 style="margin:0">'+esc(r.title)+'</h3><p class="small" style="margin:0">'+esc(dn)+' kl. '+esc(r.time)+(stat?'<br><b>'+esc(stat)+'</b>':'')+'</p>'
   +(PUSH_URL?'<label style="display:flex;gap:8px;align-items:center;font-weight:600"><input type="checkbox" id="lpPush" style="width:22px;height:22px;flex:none">Send varsel til alle (gjelder avlys og endre)</label><div id="lpMsg" style="display:none;gap:8px"><label class="f">Varseltittel<input id="lpPT" maxlength="60"></label><label class="f">Varseltekst<textarea id="lpPB" rows="3" maxlength="140"></textarea></label><span class="small">Standardteksten settes inn automatisk. Skriv over den hvis du vil si noe annet.</span></div>':'')
   +'<div class="btns col">'+(ex&&ex.k!=='fjernet'?'<button class="btn" value="angre">Angre ('+(ex.k==='avlyst'?'avlysning':'endring')+')</button>':'')+(ex&&ex.k==='avlyst'?'':'<button class="btn" value="avlys">Merk denne gangen som avlyst</button>')+'<button class="btn" value="fjern">Fjern bare denne gangen</button></div>'
   +'<details><summary style="cursor:pointer;font-weight:600">Endre denne gangen</summary><div style="display:grid;gap:8px;margin-top:8px"><label class="f">Nytt klokkeslett<input id="lpTime" type="time"></label><label class="f">Ny merknad<input id="lpNote" type="text" maxlength="100"></label><button class="btn" value="endre">Lagre</button></div></details>'
   +'<div class="btns col"><button class="btn" value="rediger">Endre hele den faste samlingen</button><button class="btn danger" value="slettalle">Slett hele den faste samlingen</button><button class="btn" value="avbryt">Avbryt</button></div></form>';
  document.body.appendChild(dlg);
  const defs=(rv,tid,nt)=>rv==='endre'?['Endret: '+r.title,dn+(TIDOK(tid)?', nå kl. '+tid:'')+(nt?'. '+nt:'')]:['Avlyst: '+r.title,dn+' kl. '+r.time+' er avlyst.'];
  const pt=dlg.querySelector('#lpPT'),pb=dlg.querySelector('#lpPB'),pc=dlg.querySelector('#lpPush');let dirty=false;
  if(pc){const d0=defs('avlys');pt.value=d0[0];pb.value=d0[1];pc.addEventListener('change',()=>{dlg.querySelector('#lpMsg').style.display=pc.checked?'grid':'none'});[pt,pb].forEach(i=>i.addEventListener('input',()=>{dirty=true}))}
  dlg.addEventListener('close',async()=>{
    const rv=dlg.returnValue,send=!!(dlg.querySelector('#lpPush')&&dlg.querySelector('#lpPush').checked),time=dlg.querySelector('#lpTime').value.trim(),note=dlg.querySelector('#lpNote').value.trim();dlg.remove();
    try{
      if(rv==='rediger'){state.adm={type:'regular',edit:id,form:true};state.tab='me';state.acc.adm=true;state.msg='';render();setTimeout(()=>{const f=$('#adm');if(f)f.scrollIntoView({block:'start'})},80);return}
      if(rv==='slettalle'){
        if(!await bekreft('Slette hele den faste samlingen «'+r.title+'»? Alle kommende ganger forsvinner.'))return;
        try{await FB.ensureSnapshot('Før sletting',5*60e3)}catch(er){if(!await bekreft('Kunne ikke lage et sikkerhetspunkt før sletting ('+((er&&er.code)||'feil')+'). Slette likevel?'))return}
        await FB.del('regular',id);await refresh();push('Slettet','«'+r.title+'» er fjernet.');return}
      const nx={...(r.ex||{})};
      if(rv==='avlys')nx[dato]={k:'avlyst'};
      else if(rv==='angre')delete nx[dato];
      else if(rv==='fjern')nx[dato]={k:'fjernet'};
      else if(rv==='endre'){if(!TIDOK(time)&&!note){push('Fyll ut','Skriv nytt klokkeslett eller en merknad.');return}nx[dato]={k:'endret',...(TIDOK(time)?{time}:{}),...(note?{note}:{})}}
      else return;
      await FB.setFastEx(id,nx);
      let tillegg='';
      if(send&&PUSH_URL&&(rv==='avlys'||rv==='endre')){
        const df=defs(rv,time,note),tittel=dirty&&pt.value.trim()?pt.value.trim():df[0],body=dirty&&pb.value.trim()?pb.value.trim():df[1];
        try{const res=await FB.sendPush(PUSH_URL,tittel,body,'prog',{type:'alle'});tillegg=res.ok?' Varsel sendt til '+res.sendt+' enheter.':' Varsel ikke sendt: '+res.feil}catch(x){tillegg=' Varsel kunne ikke sendes.'}}
      await refresh();
      push(rv==='avlys'?'Merket som avlyst':rv==='fjern'?'Fjernet denne gangen':rv==='endre'?'Endret':'Angret',(dn+'.')+tillegg)
    }catch(er){push('Kunne ikke lagre',saveMsg(er&&er.code))}});
  dlg.showModal();
}
function lpAsk(key){
  const [col,id,dato]=key.split(':');if(col==='fast')return fastAsk(id,dato);if(col==='cat')return catAsk(decodeURIComponent(id));
  const x=(col==='posts'?posts:rawEvents).find(a=>String(a.id)===id);if(!x||!FB)return;
  const tittel=col==='posts'?x.t:x.title,dlg=document.createElement('dialog');dlg.className='lp';

    if(rv==='rediger'){editAsk(col,id);return}

      if(!tt){push('Fyll ut','Skriv en tittel på varselet.');return}

      catch(er){push('Kunne ikke sende','Ingen kontakt med varseltjenesten.')}
      return}
    if(!ok)return;
    try{try{await FB.ensureSnapshot('Før sletting',5*60e3)}catch(er){if(!await bekreft('Kunne ikke lage et sikkerhetspunkt før sletting ('+((er&&er.code)||'feil')+'). Slette likevel?'))return}
      await FB.del(col,id);if(col==='events')await FB.del('rsvpCounts',id).catch(()=>{});if(col==='posts'&&x.schedId)await FB.delScheduled(x.schedId).catch(()=>{});await refresh();push('Slettet','«'+tittel+'» er fjernet.')}
    catch(er){push('Kunne ikke slette',saveMsg(er&&er.code))}});
  dlg.showModal();

async function start(){

    state.groups=u&&state.member?await FB.myGroups(u.email):[];

    state.threads=undefined;state.roles=undefined;if(u&&state.member)loadThreads();

}
